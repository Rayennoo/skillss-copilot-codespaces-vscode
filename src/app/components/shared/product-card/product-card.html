<div class="product-card" [routerLink]="['/products', product.id]">
  <div class="product-image">
    <img [src]="product.image" [alt]="product.name" />
    <div class="product-badge" *ngIf="product.stock < 10">Low Stock</div>
  </div>
  
  <div class="product-info">
    <span class="product-category">{{ product.category }}</span>
    <h3 class="product-name">{{ product.name }}</h3>
    <p class="product-description">{{ product.description }}</p>
    
    <div class="product-rating" *ngIf="product.rating">
      <span class="stars">
        <span *ngFor="let star of [1,2,3,4,5]" [class.filled]="star <= (product.rating || 0)">★</span>
      </span>
      <span class="reviews">({{ product.reviews }} reviews)</span>
    </div>
    
    <div class="product-footer">
      <span class="product-price">${{ product.price.toFixed(2) }}</span>
      <button class="quick-view-btn">View Details</button>
    </div>
  </div>
</div>
